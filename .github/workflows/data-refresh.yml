name: Weekly data refresh

on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ingestion (IRCC CSV + StatCan + RAG)
        run: python -m app.ingestion.run_ingestion --all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CHROMA_PERSIST_DIR: ./chroma_data
          EMBEDDING_BACKEND: chroma-onnx
      - name: Upload Chroma snapshot
        uses: actions/upload-artifact@v4
        with:
          name: chroma-data
          path: backend/chroma_data
          retention-days: 14
      # In production the Chroma volume lives on the App Service file share;
      # replace the artifact upload with an `az storage` sync if preferred.
